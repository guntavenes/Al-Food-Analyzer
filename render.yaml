services:
  - type: web
    name: ai-food-analyzer-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FOOD_ANALYSIS_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TIMEOUT_MS
        value: "30000"
      - key: OPENAI_MAX_RETRIES
        value: "1"
      - key: OPENAI_IMAGE_DETAIL
        value: low
      - key: MAX_IMAGE_SIZE_MB
        value: "8"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "30"
